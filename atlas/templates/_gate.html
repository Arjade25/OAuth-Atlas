{# Five-segment difficulty gate, filled to the scenario's score and coloured by its state. #}
<span class="gate state-{{ v.s.state.value }}" role="img" aria-label="Difficulty {{ v.score }} of 5, {{ v.score_label }}">
  {%- for i in range(1, 6) %}<span class="seg{% if i <= v.score %} on{% endif %}"></span>{% endfor -%}
</span>
