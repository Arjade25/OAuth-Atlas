<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OAuth Atlas{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/atlas.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/">OAuth Atlas</a>
    <p class="tagline">What it takes to get an OAuth app approved, with the source for every claim.</p>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer class="site">
    Curated guides are checked by hand against the cited pages. Requirements change; check the date on each claim.
  </footer>
</body>
</html>
